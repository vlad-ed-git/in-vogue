name: in_vogue
description: Personal outfits for tomorrow's weather.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  clock: ^1.1.2
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  get_it: ^9.3.0
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  image_picker: ^1.2.4
  intl: ^0.20.2
  path: ^1.9.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.1.1
  sign_in_with_apple: ^8.2.0
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.1
  bloc_test: ^10.0.0
  sqflite_common_ffi: ^2.4.4
  http_mock_adapter: ^0.6.1
  plugin_platform_interface: ^2.1.8
  image_picker_platform_interface: ^2.11.2
  geocoding_platform_interface: ^5.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0

# fake_cloud_firestore declares equatable ^2.1.0 but works with 3: it only
# uses props, stringify, == and hashCode, which 3.0 kept.
dependency_overrides:
  equatable: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  default-flavor: development
  config:
    enable-swift-package-manager: false
  assets:
    - assets/catalog/
    - assets/outfits/
    - assets/makeup/
    - assets/images/
  # Sofia Sans in two widths (SIL OFL, see assets/fonts/OFL.txt). Variable
  # fonts: every style selects its weight through FontVariation('wght').
  fonts:
    - family: Sofia Sans
      fonts:
        - asset: assets/fonts/SofiaSans-Variable.ttf
    - family: Sofia Sans Extra Condensed
      fonts:
        - asset: assets/fonts/SofiaSansExtraCondensed-Variable.ttf
